# ai-service 이미지를 만들어 GHCR(ghcr.io/nineouting/nineouting-ai-service)에 올림. STT 레포의 image.yml 과 같은 방식
# 같은 조직 레포라 따로 받을 자격증명이 없고, 아래 permissions와 기본 GITHUB_TOKEN이면 됨.
#
# 태그: 브랜치 이름 + 커밋 SHA (STT·백엔드 서비스 레포와 같은 모양)
# 끌어 쓰기: docker pull ghcr.io/nineouting/nineouting-ai-service:develop
name: image

on:
  push:
    branches: [develop]
    paths:
      - 'summary/**'
      - 'server/**'
      - 'rag/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'summary/**'
      - 'server/**'
      - 'rag/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nineouting/nineouting-ai-service   # GHCR 주소는 소문자만 받음 (조직 이름은 nineOuting)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # pull_request에서는 만들어만 보고 올리지 않음 (고치는 중에 이미지가 쌓이지 않게)
      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull_request에서는 올리는 대신 이 빌드 서버의 docker 에 넣어(load) 아래에서 크기를 잼
      - name: 만들어서 올리기
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 이미지 크기
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then docker pull "${IMAGE}:${GITHUB_SHA}"; fi
          size=$(docker image inspect "${IMAGE}:${GITHUB_SHA}" --format '{{.Size}}')
          echo "이미지 크기(압축 풀린 상태): $((size / 1000000)) MB (${size} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

      # 네트워크 없이, root 가 아닌 사용자로 이미지 안의 모델을 불러올 수 있는지 확인
      - name: 모델 확인
        run: |
          docker run --rm --network none "${IMAGE}:${GITHUB_SHA}" python -c "
          import os
          from rag.embedding import E5Embedder, verify_model_files
          verify_model_files()
          E5Embedder()
          print('모델 확인 uid=%d' % os.getuid())
          "

  # 태그가 붙지 않은 옛 이미지를 치움 (모델·의존성 층이 바뀔 때마다 쌓이므로)
  cleanup:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: nineouting-ai-service
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
