# Unchanged control: same pinned source and checks in both arms.
# Read-only existing Docker cache; no publishing, AWS authentication, GitOps or deployment.
name: SCRUM-357 AI unchanged CI comparison
'on':
  pull_request:
    branches:
    - develop
    paths:
    - .github/workflows/scrum-357-controls.yml
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-latest
          pair: linux-amd64
          variant: before
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
          pair: linux-arm64
          variant: before
        - platform: linux/amd64
          runner: ubuntu-latest
          pair: linux-amd64
          variant: after
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
          pair: linux-arm64
          variant: after
      max-parallel: 2
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 83ada5bb0e7b802f5796fd617e6cf1adccf57f84
        persist-credentials: false
    - name: Test ECR publish failure paths (offline)
      run: python3 .github/scripts/test_publish_dev_ecr.py
    - uses: docker/setup-buildx-action@v3
    - name: Build local image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        load: true
        tags: nineouting-verified:local
        cache-from: type=gha,scope=${{ matrix.pair }}
        push: false
    - name: "\uD655\uC778\uD560 \uC774\uBBF8\uC9C0"
      run: echo "REF=nineouting-verified:local" >> "$GITHUB_ENV"
    - name: "\uC774\uBBF8\uC9C0 \uD06C\uAE30"
      run: "size=$(docker image inspect \"$REF\" --format '{{.Size}}')\necho \"${{ matrix.platform }} \uC774\uBBF8\uC9C0 \uD06C\
        \uAE30(\uC555\uCD95 \uD480\uB9B0 \uC0C1\uD0DC): $((size / 1000000)) MB (${size} bytes)\" | tee -a \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - name: "\uBAA8\uB378 \uD655\uC778"
      run: "docker run --rm --network none \"$REF\" python -c \"\nimport os, platform\nfrom rag.embedding import E5Embedder,\
        \ verify_model_files\nverify_model_files()\nE5Embedder()\nprint('\uBAA8\uB378 \uD655\uC778 uid=%d arch=%s' % (os.getuid(),\
        \ platform.machine()))\n\"\n"
    - name: "\uACF5\uC6A9 \uCF54\uB4DC \uD655\uC778"
      run: "docker run --rm --network none \"$REF\" python -c \"\nimport openai, shared.llm, shared.callback, rag.runtime\n\
        print('\uACF5\uC6A9 \uCF54\uB4DC \uD655\uC778 openai', openai.__version__)\n\"\n"
    - name: "\uD68C\uC758\uB85D \uCD08\uC548 \uD655\uC778"
      run: "docker run --rm --network none \"$REF\" python -c \"\nimport minutes.api, minutes.runtime, minutes.worker\nfrom\
        \ minutes.migrate import MIGRATIONS\nfiles = sorted(p.name for p in MIGRATIONS.glob('*.sql'))\nassert files, '\uB9C8\
        \uC774\uADF8\uB808\uC774\uC158 \uD30C\uC77C \uC5C6\uC74C'\nprint('\uD68C\uC758\uB85D \uCD08\uC548 \uD655\uC778', files)\n\
        \"\n"
    - name: Verify real Docker config archive
      if: matrix.platform == 'linux/amd64'
      run: python3 .github/scripts/test_publish_dev_ecr.py -k real_runner
      env:
        PUBLISH_REAL_DOCKER: '1'
        REAL_DOCKER_TEST_IMAGE: nineouting-verified:local
    - name: Remove measurement image
      if: always()
      run: docker image rm nineouting-verified:local || true
    timeout-minutes: 30
